<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Liquid Glass preview</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      body { overflow: auto; }
      .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
      h1 { margin: 0 0 6px; font-size: 28px; font-weight: 700; letter-spacing: -0.35px; }
      p { margin: 0 0 22px; color: var(--text-2); }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 180px);
        grid-auto-rows: 180px;
        gap: 14px;
        justify-content: center;
      }
      .grid > * { min-width: 0; min-height: 0; }
      .wide { grid-column: span 2; }
      .big { grid-column: span 2; grid-row: span 2; }
      .themes { display: flex; gap: 10px; margin-bottom: 18px; }
      .themes button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 980px;
        border: 1px solid var(--glass-border-soft);
        background: var(--glass-fill);
        color: var(--text);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        cursor: pointer;
      }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="dark"] {
        --text: #f2f2f7;
        --text-2: rgba(235, 235, 245, 0.58);
        --icon: #c9c9d1;
        --glass-fill: rgba(52, 54, 64, 0.48);
        --glass-fill-strong: rgba(68, 70, 82, 0.58);
        --glass-border: rgba(255, 255, 255, 0.22);
        --glass-border-soft: rgba(255, 255, 255, 0.1);
        --glass-highlight: rgba(255, 255, 255, 0.28);
        --glass-specular: rgba(255, 255, 255, 0.16);
        --glass-shadow: rgba(0, 0, 0, 0.42);
        --glass-shadow-lift: rgba(0, 0, 0, 0.55);
        --tint: rgba(168, 156, 240, 0.62);
        --tint-text: #1a1240;
        --tint-edge: rgba(255, 255, 255, 0.34);
        --tint-warm: rgba(232, 186, 120, 0.64);
        --tint-warm-text: #4a2e05;
        --tint-warm-edge: rgba(255, 255, 255, 0.3);
        --tint-cool: rgba(120, 184, 232, 0.58);
        --tint-cool-text: #0a2f4d;
        --tint-cool-edge: rgba(255, 255, 255, 0.32);
        --tint-alert: rgba(240, 160, 130, 0.58);
        --tint-alert-text: #4a1a0c;
        --tint-alert-edge: rgba(255, 255, 255, 0.3);
        --bg-1: #23263a;
        --bg-2: #12141f;
        --bg-3: #2c2238;
        --bg-glow: rgba(120, 140, 200, 0.18);
      }
      html[data-theme="photo"] {
        color-scheme: dark;
        --text: #f2f2f7;
        --text-2: rgba(235, 235, 245, 0.58);
        --icon: #c9c9d1;
        --glass-fill: rgba(52, 54, 64, 0.42);
        --glass-fill-strong: rgba(68, 70, 82, 0.55);
        --glass-border: rgba(255, 255, 255, 0.28);
        --glass-border-soft: rgba(255, 255, 255, 0.14);
        --glass-highlight: rgba(255, 255, 255, 0.32);
        --glass-specular: rgba(255, 255, 255, 0.2);
        --glass-shadow: rgba(0, 0, 0, 0.4);
        --glass-shadow-lift: rgba(0, 0, 0, 0.55);
        --tint: rgba(168, 156, 240, 0.62);
        --tint-text: #1a1240;
        --tint-edge: rgba(255, 255, 255, 0.34);
        --tint-warm: rgba(232, 186, 120, 0.64);
        --tint-warm-text: #4a2e05;
        --tint-warm-edge: rgba(255, 255, 255, 0.3);
        --tint-cool: rgba(120, 184, 232, 0.58);
        --tint-cool-text: #0a2f4d;
        --tint-cool-edge: rgba(255, 255, 255, 0.32);
        --tint-alert: rgba(240, 160, 130, 0.58);
        --tint-alert-text: #4a1a0c;
        --tint-alert-edge: rgba(255, 255, 255, 0.3);
      }
      html[data-theme="photo"] body::before {
        background:
          linear-gradient(rgba(20, 24, 40, 0.28), rgba(20, 24, 40, 0.4)),
          radial-gradient(60% 50% at 20% 20%, #6a8cff 0%, transparent 60%),
          radial-gradient(50% 60% at 80% 30%, #ff8ab3 0%, transparent 55%),
          radial-gradient(70% 50% at 50% 100%, #48c6a5 0%, transparent 60%),
          #1a1d2e;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Liquid Glass</h1>
      <p>Tile material preview — light, dark, and colorful backgrounds.</p>
      <div class="themes">
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
        <button type="button" data-theme="photo">Photo</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <script type="module" src="/dev/glass-preview.ts"></script>
  </body>
</html>
